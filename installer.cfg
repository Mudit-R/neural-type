# ==============================================================================
# NeuraType: Windows Enterprise Installer Configuration (pynsist / NSIS)
# Packages NeuraType into a standalone Windows installer (.exe / .msi wrapper)
# for mass deployment via Microsoft Intune or System Center (SCCM).
# ==============================================================================

[Application]
name=NeuraType
version=1.0.0
publisher=NeuraType Enterprise Systems
entry_point=win32_hook.global_keyboard_hook:main
console=false

[Python]
version=3.11.9
bitness=64

[Include]
# Core Dependencies
packages=
    onnxruntime
    symspellpy
    pynput
    yaml

# Application Code & Local Assets
files=
    engine/ > $INSTDIR/engine
    models/corrector_model_quant.onnx > $INSTDIR/models/
    models/tokenizer/ > $INSTDIR/models/tokenizer/
    config/policy.yaml > $INSTDIR/config/
    README.md > $INSTDIR/

# Installer Behavior
# Supports silent mass installation via "/S /ALLUSERS=1"
[Build]
directory=dist/installer
